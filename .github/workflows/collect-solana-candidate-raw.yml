name: SMR raw candidate collection

on:
  push:
    branches:
      - feat/github-actions-mainnet-fixture-collector
    paths:
      - ".github/workflows/collect-solana-candidate-raw.yml"
  workflow_dispatch:
    inputs:
      signature:
        description: "Solana transaction signature (Base58)"
        required: true
        default: "Zai2uSQ832xWtjMWV1kRdVNRb1uQscfXLwD2shDtQtbDfh54AouyUviLAPPaExXf4Qpv5MVuJf3fA5BSbcoUtbp"
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMR_SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
      SIGNATURE: ${{ inputs.signature || 'Zai2uSQ832xWtjMWV1kRdVNRb1uQscfXLwD2shDtQtbDfh54AouyUviLAPPaExXf4Qpv5MVuJf3fA5BSbcoUtbp' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Collect finalized transaction through public Solana RPC
        run: |
          python tools/collect_solana_fixtures.py "$SIGNATURE" --output data/fixtures/raw
      - name: Upload raw payload and provenance manifest
        uses: actions/upload-artifact@v4
        with:
          name: smr-mainnet-candidate-raw-${{ github.run_id }}
          path: |
            data/fixtures/raw/*.raw.json
            data/fixtures/raw/*.manifest.json
          if-no-files-found: error
          retention-days: 7

# Candidate collection uses the collector's supported transaction-version ceiling.
