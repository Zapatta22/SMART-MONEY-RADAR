name: SMR mainnet fixture collection

on:
  push:
    branches:
      - feat/github-actions-mainnet-fixture-collector
    paths:
      - ".github/workflows/collect-solana-mainnet-fixture.yml"
      - "tools/collect_solana_fixtures.py"
      - "src/smart_money_radar/data_sources/rpc_fixture_collector.py"
  workflow_dispatch:
    inputs:
      signature:
        description: "Solana transaction signature (Base58)"
        required: true
        default: "G2GwWpKY3ssU9JsWtc8FHTX5PqLYgYqBDpANu1jFLHK45qvEHsiZYRMoi5kVHZQGRsx85v26PYgAtGFUkZJvgJa"
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMR_SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
      SIGNATURE: ${{ inputs.signature || 'G2GwWpKY3ssU9JsWtc8FHTX5PqLYgYqBDpANu1jFLHK45qvEHsiZYRMoi5kVHZQGRsx85v26PYgAtGFUkZJvgJa' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Collect finalized transaction through public Solana RPC
        run: |
          python tools/collect_solana_fixtures.py "$SIGNATURE" --output data/fixtures/raw
      - name: Create one-run anonymization key
        run: echo "SMR_FIXTURE_ANONYMIZATION_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
      - name: Create anonymized projection
        run: |
          mkdir -p data/fixtures/anonymized "$RUNNER_TEMP/smr-private"
          python tools/anonymize_solana_fixture.py \
            "data/fixtures/raw/$SIGNATURE.raw.json" \
            "data/fixtures/anonymized/$SIGNATURE.json" \
            "$RUNNER_TEMP/smr-private/$SIGNATURE.alias-map.json" \
            --manifest "data/fixtures/raw/$SIGNATURE.manifest.json" \
            --protect "GpMZbSM2GgvTKHJirzeGfMFoaZ8UR2X7F4v8vHTvxFbL" \
            --protect "4GgbgmEcjKtwLy8T8dKcmvfSgNuyAt4Yzq7u1CJ9ZPAd" \
            --protect "3QNXavMTGaVoB8Kw6TczZjoqdDda8F5heiMRCKwH3SMC" \
            --protect "9XYDhuomPSUdYJTykr3wSzqM8Yhxj5pB8PBxVhcfJf1E" \
            --protect "Bt6R1voUhMCMXVwBEU1YnYZLFyYmLczi1ziVQzKqgpkU" \
            --protect "bgzmGhu9qcyLW6qR1HKQuLTY6PWktNSAuzLNmo7aiQY" \
            --protect "D4FPEruKEHrG5TenZ2mpDGEfu1iUvTiqBxvpU8HLBvC2" \
            --protect "97NVw4kt2cNVY1C4QrPerxDA9PXTajKawmiCZ6uBziTw" \
            --protect "47hEzz83VFR23rLTEeVm9A7eFzjJwjvdupPPmX3cePqF" \
            --anonymize "Bqf4XHmhMjeVscQCm6MvceujcLVQgNHD9PNEVbQWrdUa" \
            --anonymize "6xNMoXM3p7s4AWLvujFFcw3rPBw65qTTcdGQVjAwakat"
      - name: Upload raw payload and provenance manifest
        uses: actions/upload-artifact@v4
        with:
          name: smr-mainnet-fixture-${{ github.run_id }}
          path: |
            data/fixtures/raw/*.raw.json
            data/fixtures/raw/*.manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload anonymized test projection
        uses: actions/upload-artifact@v4
        with:
          name: smr-mainnet-fixture-projection-${{ github.run_id }}
          path: |
            data/fixtures/anonymized/*.json
          if-no-files-found: error
          retention-days: 30
