name: Import SMR Etapa 16 source

on:
  push:
    branches: [main]
    paths:
      - "SMR-CODIGO-BASE-ETAPA16-2026-11-16.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract only the canonical Etapa 16 archive
        shell: bash
        run: |
          set -euo pipefail
          archive="SMR-CODIGO-BASE-ETAPA16-2026-11-16.zip"
          test -f "$archive"
          mkdir -p /tmp/smr-import
          python - "$archive" /tmp/smr-import <<'PY'
          import pathlib, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              for member in z.infolist():
                  path = pathlib.PurePosixPath(member.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {member.filename}")
                  if member.is_dir():
                      continue
                  target = destination.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(member) as src, target.open("wb") as dst:
                      dst.write(src.read())
          PY

      - name: Locate one project root and sanitize
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path("/tmp/smr-import")
          markers = sorted(root.rglob("pyproject.toml"))
          if len(markers) != 1:
              raise SystemExit(f"Expected exactly one pyproject.toml; found {len(markers)}")
          project = markers[0].parent
          if not (project / "src" / "smart_money_radar").is_dir():
              raise SystemExit("Canonical archive does not contain src/smart_money_radar.")
          if not (project / "tests").is_dir():
              raise SystemExit("Canonical archive does not contain tests/.")
          destination = Path.cwd()
          for item in project.iterdir():
              target = destination / item.name
              if item.is_dir():
                  if target.exists():
                      shutil.rmtree(target)
                  shutil.copytree(item, target)
              else:
                  shutil.copy2(item, target)
          print(f"Imported project root: {project}")
          PY
          find . -type d \( -name __pycache__ -o -name .pytest_cache -o -name .mypy_cache -o -name .ruff_cache \) -prune -exec rm -rf {} +
          find . -type f \( -name "*.pyc" -o -name "*.sqlite" -o -name "*.sqlite3" -o -name "*.db" -o -name ".env" \) -delete
          find . -type f -name "*.zip" -delete

      - name: Verify no obvious secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' --exclude='.env.example' '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|api[_-]?key[[:space:]]*=[[:space:]]*["\x27][A-Za-z0-9_-]{20,})' .; then
            echo "Potential credential detected; refusing import."
            exit 1
          fi

      - name: Install and test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" || python -m pip install -e .
          if python -c "import pytest" >/dev/null 2>&1; then
            python -m pytest -q
          else
            PYTHONPATH=src python -m unittest discover -s tests -v
          fi
          python -m compileall -q src tests

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "chore: import canonical SMR Etapa 16 source"
            git push
          fi
