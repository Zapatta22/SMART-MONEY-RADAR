name: SMR CM27 read-only bounded Solana WebSocket live gate

on:
  workflow_dispatch:
    inputs:
      approve_read_only:
        description: "Type READ_ONLY_BOUNDED_CM27 to authorize one short public-network capture"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: smr-cm27-public-live-capture
  cancel-in-progress: false

jobs:
  capture:
    if: ${{ inputs.approve_read_only == 'READ_ONLY_BOUNDED_CM27' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout immutable workflow controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: controls
          persist-credentials: false
      - name: Checkout CI-validated source revision, not a moving branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 49bb5e7763926d28e540ca13d9557056b9d87833
          path: source
          persist-credentials: false
      - name: Setup pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install binary-only runtime from SHA256 lock and verify immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "49bb5e7763926d28e540ca13d9557056b9d87833"
          python -m pip install --no-cache-dir --no-deps --only-binary=:all: \
            --require-hashes -r controls/requirements/cm27-live-linux-py312.lock
          PYTHONPATH=source/src python - <<'PY'
          from smart_money_radar.services.cpmm_ws_resilience import WsResiliencePolicy
          from pathlib import Path
          s=Path("source/tools/capture_live_cpmm_ws_baseline.py").read_text()
          assert WsResiliencePolicy().max_reconnects == 1
          assert "MAX_SECONDS=75" in s and "MAX_FRAMES=80" in s
          assert "LIVE_CAPTURE_OPT_IN" in s
          PY
      - name: One bounded read-only capture with independent process timeout
        shell: bash
        env:
          SMR_LIVE_CAPTURE_OPT_IN: READ_ONLY_BOUNDED_CM27
        run: |
          set -uo pipefail
          mkdir -p /tmp/smr-cpmm-baseline-live
          cd source
          timeout --signal=TERM --kill-after=5s 90s env PYTHONPATH=src \
            SMR_LIVE_CAPTURE_OPT_IN="$SMR_LIVE_CAPTURE_OPT_IN" \
            python -u tools/capture_live_cpmm_ws_baseline.py
          rc=$?
          printf '%s\n' "$rc" > /tmp/smr-cpmm-baseline-live/capture_exit_code.txt
          exit "$rc"
      - name: Always write audit termination / failure manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f controls/tools/cm27_finalize_manifest.py ]; then
            python3 controls/tools/cm27_finalize_manifest.py \
              /tmp/smr-cpmm-baseline-live \
              49bb5e7763926d28e540ca13d9557056b9d87833 \
              controls/requirements/cm27-live-linux-py312.lock \
              source/tools/capture_live_cpmm_ws_baseline.py
          else
            mkdir -p /tmp/smr-cpmm-baseline-live
            printf '%s\n' '{"status":"FAILED_OR_INCOMPLETE","coverage":"UNKNOWN","financial_execution_authorized":false,"reason":"workflow_controls_checkout_missing"}' > /tmp/smr-cpmm-baseline-live/manifest.json
          fi
      - name: Preserve RAW SQLite session and failure manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smr-cm27-live-read-only
          path: /tmp/smr-cpmm-baseline-live/
          retention-days: 7
          if-no-files-found: error
