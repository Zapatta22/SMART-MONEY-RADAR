name: SMR CM27 offline lock and gate tests (no network capture)
on:
  push:
    branches: [ci/smr-live-gate-registration-cm30]
permissions:
  contents: read
jobs:
  offline-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify binary-only pinned wheel hashes
        run: |
          python -m pip download --no-deps --only-binary=:all: --require-hashes \
            -r requirements/cm27-live-linux-py312.lock -d /tmp/cm27-lock-check
      - name: Test termination, failed capture and immutable workflow controls
        run: python tests/test_cm27_live_gate_offline.py -v
