name: SMR CM27 offline dependency wheel lock probe
on:
  push:
    branches: [ci/smr-live-gate-registration-cm30]
permissions:
  contents: read
jobs:
  offline-lock-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Resolve immutable CPython 3.12 Linux wheel SHA256 without network capture
        run: |
          set -euo pipefail
          mkdir -p /tmp/cm27-wheel-probe
          python -m pip download --no-deps --only-binary=:all: -d /tmp/cm27-wheel-probe \
             python-dotenv==1.1.1 websockets==15.0.1 protobuf==6.32.1
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          for p in sorted(Path("/tmp/cm27-wheel-probe").glob("*.whl")):
              print("CM27_LOCK_WHEEL",p.name,sha256(p.read_bytes()).hexdigest(),flush=True)
          PY
