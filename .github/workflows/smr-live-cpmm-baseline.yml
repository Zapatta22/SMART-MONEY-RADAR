name: SMR one-shot four-account WS plus contemporaneous RPC baseline

on:
  push:
    branches:
      - codex/smr-cpmm-live-baseline
    paths:
      - .github/workflows/smr-live-cpmm-baseline.yml

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing dependencies
        run: python -m pip install -e .
      - name: Single bounded WebSocket session plus exactly one four-account RPC baseline
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python tools/capture_live_cpmm_ws_baseline.py
      - name: Preserve all original evidence, outcomes and SQLite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smr-live-cpmm-ws-baseline
          path: /tmp/smr-cpmm-baseline-live/
          if-no-files-found: error
          retention-days: 7
