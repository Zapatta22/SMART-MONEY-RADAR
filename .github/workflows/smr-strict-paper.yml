name: SMR strict paper replay checks

on:
  pull_request:
    paths:
      - 'src/smart_money_radar/cli.py'
      - 'src/smart_money_radar/domain/paper_*.py'
      - 'tests/test_paper_*.py'
      - '.github/workflows/smr-strict-paper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Risk policy tests
        run: python -m unittest discover -s tests -p 'test_paper_entry_risk_policy.py' -v
      - name: Quote provenance tests
        run: python -m unittest discover -s tests -p 'test_paper_evidence_gate.py' -v
      - name: Evidence replay tests
        run: python -m unittest discover -s tests -p 'test_paper_evidence_replay.py' -v
      - name: Protected CLI acceptance tests
        run: python -m unittest discover -s tests -p 'test_paper_strict_cli.py' -v
