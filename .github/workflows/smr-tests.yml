name: SMR tests

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/benchmark_geyser_unsequenced_audit.py"
      - "tools/benchmark_cm36_supervisor.py"
      - "pyproject.toml"
      - ".github/workflows/smr-tests.yml"
  pull_request:
    branches: [main, 'feat/**', 'integration/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Benchmark offline CM36 supervisor
        run: |
          for sample in 1 2 3; do
            echo "CM36_BENCHMARK_SAMPLE $sample/3 (fresh process and database)"
            PYTHONPATH=src python tools/benchmark_cm36_supervisor.py
          done
