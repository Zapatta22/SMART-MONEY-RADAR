name: SMR tests

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/benchmark_geyser_unsequenced_audit.py"
      - "tools/benchmark_cm36_supervisor.py"
      - "tools/*android*.sh"
      - "tools/prepare_smr_eval_db.py"
      - "pyproject.toml"
      - ".github/workflows/smr-tests.yml"
  pull_request:
    branches: [main, 'feat/**', 'integration/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Benchmark offline CM36 supervisor
        run: |
          for sample in 1 2 3; do
            echo "CM36_BENCHMARK_SAMPLE $sample/3 (fresh process and database)"
            PYTHONPATH=src python tools/benchmark_cm36_supervisor.py
          done

  python314-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install project dependencies on Python 3.14
        run: python -m pip install -e .
      - name: Verify compatible dashboard and Android installer paths
        run: |
          bash -n tools/install_smr_android_eval.sh tools/run_smr_dashboard_android.sh tools/start_smr_dashboard_background_android.sh tools/watch_smr_dashboard_android.sh tools/loop_smr_dashboard_watchdog_android.sh
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_cm37*.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_dashboard_android_launcher.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_dashboard_android_background_launcher.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_dashboard_android_watchdog.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_dashboard_android_periodic_watchdog.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_dashboard_android_authenticated_health.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_android_eval_installer.py' -v
