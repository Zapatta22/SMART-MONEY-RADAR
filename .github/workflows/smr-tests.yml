name: SMR tests

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/benchmark_geyser_unsequenced_audit.py"
      - "pyproject.toml"
      - ".github/workflows/smr-tests.yml"
  pull_request:
    branches: [main, 'feat/**', 'integration/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile source and tests
        run: python -m compileall -q src tests

  geyser-audit-benchmark:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/geyser-audit-bounded-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run synthetic rebuild benchmark
        run: |
          set -o pipefail
          PYTHONPATH=src python tools/benchmark_geyser_unsequenced_audit.py --sizes 1000 10000 50000 100000 | tee benchmark-results.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: geyser-audit-bounded-rebuild-results
          path: benchmark-results.json
          if-no-files-found: error
