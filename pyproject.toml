[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-money-radar"
version = "0.1.0"
description = "Monitoramento local e somente leitura de atividade pública na Solana."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0,<2.0",
    "websockets>=14.0,<16.0",
]

[project.scripts]
smr = "smart_money_radar.cli:main"
smr-api = "smart_money_radar.services.dashboard_http:main"

[tool.setuptools.packages.find]
where = ["src"]